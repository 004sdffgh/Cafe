<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacto y horario de Café Raíz en Monterrey, Nuevo León. Escríbenos con el formulario.">
    <title>Contacto | Café Raíz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="salto" href="#contenido">Saltar al contenido</a>
    <header class="encabezado">
        <p class="nombre-sitio">Café Raíz</p>
        <nav aria-label="Navegación principal">
            <ul class="navegacion">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Productos</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor" id="contenido">
        <section class="contacto">
            <div>
                <h1>Contacto</h1>
                <h2>Visítanos</h2>
                <p>Estamos en Monterrey, Nuevo León. Puedes escribirnos mediante el siguiente formulario.</p>
                <p><strong>Horario:</strong> lunes a sábado, de 8:00 a 19:00.</p>
            </div>

            <div class="formulario-contenedor">
                <h2>Envíanos un mensaje</h2>
                <form action="#" method="get">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                    <button class="boton" type="submit">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="pie">
        <p>Café Raíz · Monterrey, Nuevo León</p>
    </footer>
</body>
</html>
